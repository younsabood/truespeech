<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">TrueSpeech Encoder</title>
  <desc id="description">A colorful audio waveform banner for the Rust TrueSpeech encoder, with an 8 kHz mono PCM input and 32-byte packet output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#192552"/>
      <stop offset="100%" stop-color="#482b70"/>
    </linearGradient>
    <!-- userSpaceOnUse: one gradient across the whole waveform, not a mini-gradient inside every 10px bar -->
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="794" y1="0" x2="1144" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="52%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#cbd5e1" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <!-- Decorative curve: moved below the text row and clipped to the rounded corners -->
  <path d="M0 296C220 262 340 318 560 292S900 262 1200 300" fill="none" stroke="#60a5fa" stroke-opacity=".16" stroke-width="2" clip-path="url(#card)"/>

  <!-- Text block (textLength pins widths so layout stays identical across fallback fonts) -->
  <g font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <rect x="56" y="51" width="272" height="34" rx="17" fill="#0f766e" fill-opacity=".28" stroke="#5eead4" stroke-opacity=".65"/>
    <circle cx="76" cy="68" r="5" fill="#5eead4"/>
    <text x="92" y="73" fill="#ccfbf1" font-size="13" font-weight="700" textLength="214" lengthAdjust="spacing">OPEN SOURCE · RUST · AUDIO</text>

    <text x="55" y="163" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="-2">TrueSpeech</text>
    <text x="56" y="210" fill="#c4b5fd" font-size="27" font-weight="600">A stateful encoder for Rust and native apps</text>

    <g fill="#cbd5e1" font-size="17">
      <text x="56" y="264" textLength="130" lengthAdjust="spacing">8 kHz mono PCM</text>
      <text x="219" y="264" textLength="168" lengthAdjust="spacing">240 samples per frame</text>
      <text x="420" y="264" textLength="118" lengthAdjust="spacing">32-byte packets</text>
    </g>
    <circle cx="203" cy="258" r="3" fill="#5eead4"/>
    <circle cx="404" cy="258" r="3" fill="#60a5fa"/>
  </g>

  <!-- Waveform: centered on y=160, right margin matches the left margin (56px) -->
  <path d="M774 160H1164" fill="none" stroke="url(#wave)" stroke-opacity=".25" stroke-width="1"/>
  <g fill="url(#wave)" opacity=".96">
    <rect x="794" y="143" width="10" height="34" rx="5"/>
    <rect x="814" y="121" width="10" height="78" rx="5"/>
    <rect x="834" y="91" width="10" height="138" rx="5"/>
    <rect x="854" y="112" width="10" height="96" rx="5"/>
    <rect x="874" y="75" width="10" height="170" rx="5"/>
    <rect x="894" y="104" width="10" height="112" rx="5"/>
    <rect x="914" y="136" width="10" height="48" rx="5"/>
    <rect x="934" y="84" width="10" height="152" rx="5"/>
    <rect x="954" y="60" width="10" height="200" rx="5"/>
    <rect x="974" y="108" width="10" height="104" rx="5"/>
    <rect x="994" y="130" width="10" height="60" rx="5"/>
    <rect x="1014" y="95" width="10" height="130" rx="5"/>
    <rect x="1034" y="73" width="10" height="174" rx="5"/>
    <rect x="1054" y="119" width="10" height="82" rx="5"/>
    <rect x="1074" y="143" width="10" height="34" rx="5"/>
    <rect x="1094" y="106" width="10" height="108" rx="5"/>
    <rect x="1114" y="134" width="10" height="52" rx="5"/>
    <rect x="1134" y="150" width="10" height="20" rx="5"/>
  </g>
</svg>