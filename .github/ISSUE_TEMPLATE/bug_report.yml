name: Bug report
description: Report a reproducible problem with the encoder or its integrations.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Please avoid attaching private recordings or secrets. Include a minimal reproducible example when possible.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest input, code sample, or sequence of steps that reproduces the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, Rust version, and whether you use the Rust API or Windows DLL.
      render: text
    validations:
      required: true
